[project]
name = "medmemgraph"
version = "0.1.0"
description = "Graph-native longitudinal clinical agent memory on HydraDB — Hack Hydra Track 03"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    # Pinned exactly: the check_supported_server_product patch target moved
    # between 5.x and 6.x. See decisions/003 and literature/10 §F0.
    "neo4j==5.28.2",
    "requests>=2.32",
    "numpy>=2.1",
    "bm25s>=0.2",
    "tiktoken>=0.8",
    "python-dotenv>=1.0",
    "openai>=3.1.0",
    "google-genai>=2.18.1",
    "sentence-transformers>=5.7.0",
    "arize-phoenix-otel>=0.17.1",
    "openinference-instrumentation-openai>=0.1.54",
    "openinference-instrumentation-google-genai>=1.4.0",
    "optimum[onnxruntime]>=2.1.0",
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medmemgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --timeout=120"
markers = [
    "live: requires a running HydraDB node on :7687/:8443",
    "llm: requires an LLM API key",
    "slow: loads a real local ML model (several seconds to tens of seconds); local inference costs no API budget so this is not `live`/`llm`-gated, but `-m \"not slow\"` skips it for a fast dev loop",
]
